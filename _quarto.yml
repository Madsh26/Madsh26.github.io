project:
  type: website
  output-dir: _site
  render:
    - '*.qmd'
    - 'proyectos/*.qmd'
  resources:
    - assets/
    - reportes/
    - .nojekyll
website:
  title: Mauricio Serrano
  site-url: https://madsh26.github.io
  description: Ingeniería industrial, analítica de datos y estadística aplicada. Proyectos de Mauricio Serrano.
  favicon: assets/favicon.svg
  search: false
  image: /assets/social-card.jpg
  open-graph:
    image: /assets/social-card.jpg
    image-width: 1200
    image-height: 630
    image-alt: Mauricio Serrano — Análisis de datos y estadística aplicada
    locale: es_CO
  twitter-card:
    card-style: summary_large_image
    image: /assets/social-card.jpg
format:
  html:
    lang: es
    theme: none
    css: assets/styles.css
    toc: false
    anchor-sections: false
    title-block-style: none
    # La marca se añade una sola vez; las páginas usan títulos sin el nombre.
    title-prefix: ""
    page-layout: full
    include-before-body: includes/header.html
    include-after-body: includes/footer.html
    include-in-header:
      text: |
        <meta name="theme-color" content="#12233f">
        <script src="/assets/site.js" defer></script>
execute:
  enabled: false
